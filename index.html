<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Citas Kathe Creative Nails</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f2f7;
            margin: 0;
            padding: 20px;
            color: #2c2c2c;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(91, 58, 125, 0.08);
        }

        h1 {
            color: #5b3a7d;
            font-size: 26px;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            background-color: #faf8fc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2d9ec;
        }

        .form-grid input,
        .form-grid select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1c7dc;
            border-radius: 6px;
            background-color: #ffffff;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        .form-grid input:focus,
        .form-grid select:focus {
            border-color: #5b3a7d;
            box-shadow: 0 0 0 2px rgba(91, 58, 125, 0.15);
        }

        .btn-agregar {
            background-color: #5b3a7d;
            color: #ffffff;
            border: none;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            grid-column: span 1;
            transition: background-color 0.2s;
        }

        .btn-agregar:hover {
            background-color: #482c64;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        thead {
            background-color: #5b3a7d;
            color: #ffffff;
        }

        th, td {
            padding: 12px 14px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #eeeaf2;
        }

        th {
            font-weight: 600;
        }

        tbody tr:hover {
            background-color: #faf8fc;
        }

        .select-tabla {
            padding: 6px 10px;
            border: 1px solid #d1c7dc;
            border-radius: 4px;
            background-color: #ffffff;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            outline: none;
        }

        .select-tabla:focus {
            border-color: #5b3a7d;
        }

        .btn-eliminar {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-eliminar:hover {
            background-color: #c9302c;
        }

        .footer-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            padding-top: 10px;
            border-top: 2px solid #eeeaf2;
        }

        .total-container {
            font-size: 18px;
            font-weight: 700;
            color: #2c2c2c;
        }

        .btn-exportar {
            background-color: #ffffff;
            color: #5b3a7d;
            border: 1px solid #5b3a7d;
            padding: 9px 18px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-exportar:hover {
            background-color: #5b3a7d;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kathe Creative Nails</h1>
    <div id="estado-nube" style="margin:0 0 18px;padding:12px 14px;border:1px solid #e2d9ec;border-radius:8px;background:#faf8fc;text-align:center;">
        <div id="estado-sesion" style="font-size:14px;margin-bottom:10px;">Conectando con Firebase...</div>
        <button id="btn-google" type="button" style="background:#5b3a7d;color:white;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;">Iniciar sesión con Google</button>
        <button id="btn-salir" type="button" style="display:none;background:#777;color:white;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;">Cerrar sesión</button>
    </div>

    <div class="form-grid">
        <input type="date" id="fecha">
        
        <select id="hora">

            <option value="9:00 AM">9:00 AM</option>
            <option value="9:30 AM">9:30 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>

            <option value="12:00 PM">12:00 PM</option>

            <option value="1:30 PM">1:30 PM</option>
            <option value="2:00 PM">2:00 PM</option>
            <option value="2:30 PM">2:30 PM</option>
            <option value="3:00 PM">3:00 PM</option>
            <option value="3:30 PM">3:30 PM</option>
            <option value="4:00 PM">4:00 PM</option>
            <option value="4:30 PM">4:30 PM</option>
            <option value="5:00 PM">5:00 PM</option>
            <option value="5:30 PM">5:30 PM</option>
            <option value="6:00 PM">6:00 PM</option>
            <option value="6:30 PM">6:30 PM</option>
            <option value="7:00 PM">7:00 PM</option>
            <option value="7:30 PM">7:30 PM</option>
            <option value="8:00 PM">8:00 PM</option>
            <option value="8:30 PM">8:30 PM</option>
            <option value="9:00 PM">9:00 PM</option>
            <option value="9:30 PM">9:30 PM</option>
            <option value="10:00 PM">10:00 PM</option>
            <option value="10:30 PM">10:30 PM</option>
            <option value="11:00 PM">11:00 PM</option>
            <option value="11:30 PM">11:30 PM</option>
            <option value="12:00 AM">12:00 AM</option>
        </select>

        <input type="text" id="cliente" placeholder="Nombre del cliente">

        <select id="servicio">
            <option value="Tradicional Manos">Tradicional Manos</option>
            <option value="Tradicional Pies">Tradicional Pies</option>
            <option value="Tradicional M+P">Tradicional M+P</option>
            <option value="Semipermanente Manos">Semipermanente Manos</option>
            <option value="Semipermanente Pies">Semipermanente Pies</option>
            <option value="Semipermanente M+P">Semipermanente M+P</option>
            <option value="Acrílico">Acrílico</option>
            <option value="Polygel">Polygel</option>
            <option value="Softgel">Softgel</option>
            <option value="Dipping">Dipping</option>
            <option value="Building Gel">Building Gel</option>
            <option value="Base Rubber">Base Rubber</option>
            <option value="Pedicure Tradicional">Pedicure Tradicional</option>
            <option value="Pedicure Semipermanente">Pedicure Semipermanente</option>

        <select id="precio">
            <option value="10000">$10.000</option>
            <option value="15000">$15.000</option>
            <option value="20000">$20.000</option>
            <option value="25000">$25.000</option>
            <option value="30000">$30.000</option>
            <option value="35000" selected>$35.000</option>
            <option value="40000">$40.000</option>
            <option value="45000">$45.000</option>
            <option value="50000">$50.000</option>
            <option value="55000">$55.000</option>
            <option value="60000">$60.000</option>
            <option value="65000">$65.000</option>
            <option value="70000">$70.000</option>
            <option value="75000">$75.000</option>
            <option value="80000">$80.000</option>
            <option value="85000">$85.000</option>
            <option value="90000">$90.000</option>
            <option value="95000">$95.000</option>
            <option value="100000">$100.000</option>
            <option value="105000">$105.000</option>
            <option value="110000">$110.000</option>
            <option value="115000">$115.000</option>
            <option value="120000">$120.000</option>
            <option value="125000">$125.000</option>
            <option value="130000">$130.000</option>
            <option value="135000">$135.000</option>
            <option value="140000">$140.000</option>
            <option value="145000">$145.000</option>
            <option value="150000">$150.000</option>
        </select>

        <button class="btn-agregar" onclick="agregarCita()">Agregar Cita</button>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Día</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Cliente</th>
                    <th>Servicio</th>
                    <th>Precio</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-citas">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>

    <div class="footer-container">
        <div class="total-container">
            Total Ingresos: <span id="total-ingresos">$0</span>
        </div>
        <button class="btn-exportar" onclick="exportarCSV()">Descargar Respaldo (Excel / CSV)</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
        getAuth, GoogleAuthProvider, signInWithPopup,
        onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
        getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
        onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC3Y6cI6eBiNTxjM-D4C-JEk45Fy0_oCAc",
        authDomain: "kathe-creative-nails-96ef9.firebaseapp.com",
        projectId: "kathe-creative-nails-96ef9",
        storageBucket: "kathe-creative-nails-96ef9.firebasestorage.app",
        messagingSenderId: "49366527838",
        appId: "1:49366527838:web:8578a814118166c1e069cf"
    };

    const CORREOS_PERMITIDOS = [
        "valcarcel.felipe26@gmail.com",
        "kathe21palacio@gmail.com"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const proveedorGoogle = new GoogleAuthProvider();
    proveedorGoogle.setCustomParameters({ prompt: "select_account" });

    const listaServicios = [
        "Tradicional Manos", "Tradicional Pies", "Tradicional M+P",
        "Semipermanente Manos", "Semipermanente Pies", "Semipermanente M+P",
        "Acrílico", "Polygel", "Softgel", "Dipping", "Building Gel",
        "Base Rubber", "Pedicure Tradicional", "Pedicure Semipermanente"
    ];

    let citas = [];
    let usuarioActual = null;
    let cancelarEscucha = null;
    let guardando = false;

    const estadoSesion = document.getElementById("estado-sesion");
    const btnGoogle = document.getElementById("btn-google");
    const btnSalir = document.getElementById("btn-salir");
    console.log("JAVASCRIPT DE FIREBASE CARGADO");

    document.addEventListener("DOMContentLoaded", () => {
        const fechaInput = document.getElementById("fecha");
        if (!fechaInput.value) {
            const hoy = new Date();
            const local = new Date(hoy.getTime() - hoy.getTimezoneOffset() * 60000);
            fechaInput.value = local.toISOString().split("T")[0];
        }
        renderizar();
    });

    function mostrarEstado(mensaje, conectado = false) {
        estadoSesion.textContent = mensaje;
        estadoSesion.style.color = conectado ? "#237a45" : "#5b3a7d";
    }

    btnGoogle.addEventListener("click", async () => {
        try {
            mostrarEstado("Abriendo Google...");
            const resultado = await signInWithPopup(auth, proveedorGoogle);
            if (resultado && resultado.user) {
                mostrarEstado("Google autorizó la cuenta. Conectando agenda...");
            }
        } catch (error) {
            console.error(error);
            mostrarEstado("No se pudo iniciar sesión: " + error.message);
        }
    });

    btnSalir.addEventListener("click", async () => {
        try { await signOut(auth); }
        catch (error) { mostrarEstado("Error al cerrar sesión: " + error.message); }
    });

    // El acceso usa ventana emergente para evitar problemas de retorno
    // de autenticación en navegadores móviles con GitHub Pages.

    onAuthStateChanged(auth, async (usuario) => {
        if (cancelarEscucha) {
            cancelarEscucha();
            cancelarEscucha = null;
        }

        if (!usuario) {
            usuarioActual = null;
            citas = [];
            btnGoogle.style.display = "inline-block";
            btnSalir.style.display = "none";
            mostrarEstado("Inicia sesión con uno de los dos Gmail autorizados para ver la agenda.");
            renderizar();
            return;
        }

        const correo = (usuario.email || "").toLowerCase();
        if (!usuario.emailVerified || !CORREOS_PERMITIDOS.includes(correo)) {
            await signOut(auth);
            mostrarEstado("Acceso no autorizado. Usa uno de los dos Gmail habilitados.");
            return;
        }

        usuarioActual = usuario;
        btnGoogle.style.display = "none";
        btnSalir.style.display = "inline-block";
        mostrarEstado("Conectando agenda para " + correo + "...");

        const citasRef = collection(db, "citas");
        cancelarEscucha = onSnapshot(citasRef, async (snapshot) => {
            citas = snapshot.docs.map(d => ({ ...d.data(), id: d.id }));
            ordenarCitas();
            renderizar();
            mostrarEstado("Sincronizado en la nube · " + correo, true);

            // Importa una sola vez las citas guardadas previamente en este dispositivo,
            // únicamente si la colección compartida está vacía.
            const claveMigracion = "kathe_firebase_migrado_v1_" + correo;
            if (!snapshot.metadata.fromCache &&
                snapshot.empty &&
                !localStorage.getItem(claveMigracion)) {
                const antiguas = JSON.parse(
                    localStorage.getItem("kathe_citas_v4") ||
                    localStorage.getItem("kathe_c_v4") || "[]"
                );
                if (antiguas.length) {
                    try {
                        for (const cita of antiguas) {
                            const { id, ...datos } = cita;
                            await addDoc(citasRef, {
                                ...datos,
                                precio: Number(datos.precio) || 0,
                                creadoPor: correo
                            });
                        }
                    } catch (error) {
                        console.error(error);
                        mostrarEstado("No se pudieron importar las citas anteriores: " + error.message);
                        return;
                    }
                }
                localStorage.setItem(claveMigracion, "si");
            }
        }, (error) => {
            console.error(error);
            mostrarEstado("Error de sincronización: " + error.message);
        });
    });

    function generarOpcionesServicios(seleccionado) {
        return listaServicios.map(s =>
            `<option value="${s}" ${s === seleccionado ? "selected" : ""}>${s}</option>`
        ).join("");
    }

    function formatearMoneda(val) {
        return "$" + Number(val).toLocaleString("es-CO");
    }

    function obtenerDia(fechaStr) {
        const [y, m, d] = fechaStr.split("-").map(Number);
        const dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        return dias[new Date(y, m - 1, d).getDay()];
    }

    function formatearFecha(fechaStr) {
        const [y, m, d] = fechaStr.split("-");
        return `${d}/${m}/${y}`;
    }

    function minutosHora(horaStr) {
        const [time, ampm] = horaStr.split(" ");
        let [h, min] = time.split(":").map(Number);
        if (ampm === "PM" && h !== 12) h += 12;
        if (ampm === "AM" && h === 12) h = 0;
        return h * 60 + min;
    }

    function ordenarCitas() {
        citas.sort((a, b) => {
            const [da, ma, ya] = a.fecha.split("/");
            const [db, mb, yb] = b.fecha.split("/");
            const isoA = `${ya}-${ma}-${da}`;
            const isoB = `${yb}-${mb}-${db}`;
            return isoA.localeCompare(isoB) || minutosHora(a.hora) - minutosHora(b.hora);
        });
    }

    async function agregarCita() {
        if (!usuarioActual) {
            alert("Primero inicia sesión con un Gmail autorizado.");
            return;
        }
        const fechaVal = document.getElementById("fecha").value;
        const horaVal = document.getElementById("hora").value;
        const clienteVal = document.getElementById("cliente").value.trim();
        const servicioVal = document.getElementById("servicio").value;
        const precioVal = parseInt(document.getElementById("precio").value, 10);

        if (!fechaVal) { alert("Selecciona una fecha."); return; }
        if (!clienteVal) {
            alert("Escribe el nombre del cliente.");
            document.getElementById("cliente").focus();
            return;
        }

        const nueva = {
            dia: obtenerDia(fechaVal),
            fecha: formatearFecha(fechaVal),
            hora: horaVal,
            cliente: clienteVal,
            servicio: servicioVal,
            precio: precioVal,
            creadoPor: usuarioActual.email
        };

        try {
    const citasActuales = await getDocs(collection(db, "citas"));

    const espacioOcupado = citasActuales.docs.some((documento) => {
        const citaExistente = documento.data();

        return citaExistente.fecha === nueva.fecha &&
               citaExistente.hora === nueva.hora;
    });

    if (espacioOcupado) {
        alert("Ese horario ya está ocupado. Por favor, selecciona otra hora.");
        return;
    }

    await addDoc(collection(db, "citas"), nueva);
    document.getElementById("cliente").value = "";

} catch (error) {
    console.error(error);
    alert("No se pudo guardar la cita: " + error.message);
}
            console.error(error);
            alert("No se pudo guardar la cita: " + error.message);
        }
    }

    async function cambiarServicio(id, nuevoServ) {
        if (!usuarioActual) return;
        try {
            await updateDoc(doc(db, "citas", String(id)), { servicio: nuevoServ });
        } catch (error) {
            console.error(error);
            alert("No se pudo actualizar el servicio: " + error.message);
        }
    }

    async function eliminarCita(id) {
        if (!usuarioActual) return;
        if (!confirm("¿Seguro que deseas eliminar esta cita?")) return;
        try {
            await deleteDoc(doc(db, "citas", String(id)));
        } catch (error) {
            console.error(error);
            alert("No se pudo eliminar la cita: " + error.message);
        }
    }

    function renderizar() {
        const tbody = document.getElementById("tabla-citas");
        tbody.innerHTML = "";
        let total = 0;

        citas.forEach(c => {
            total += Number(c.precio) || 0;
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${c.dia || ""}</td>
                <td>${c.fecha || ""}</td>
                <td>${c.hora || ""}</td>
                <td><strong>${escaparHTML(c.cliente || "")}</strong></td>
                <td>
                    <select class="select-tabla" ${usuarioActual ? "" : "disabled"}
                        onchange="cambiarServicio('${String(c.id).replace(/'/g, "\\\\'")}', this.value)">
                        ${generarOpcionesServicios(c.servicio)}
                    </select>
                </td>
                <td>${formatearMoneda(c.precio)}</td>
                <td><button class="btn-eliminar" ${usuarioActual ? "" : "disabled"}
                    onclick="eliminarCita('${String(c.id).replace(/'/g, "\\\\'")}')">Eliminar</button></td>
            `;
            tbody.appendChild(tr);
        });
        document.getElementById("total-ingresos").textContent = formatearMoneda(total);
    }

    function escaparHTML(texto) {
        return String(texto).replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
    }

    function exportarCSV() {
        if (citas.length === 0) { alert("No hay citas para exportar."); return; }
        let csv = "\uFEFFDía,Fecha,Hora,Cliente,Servicio,Precio\n";
        citas.forEach(c => {
            const limpiar = v => String(v ?? "").replace(/"/g, '""');
            csv += `"${limpiar(c.dia)}","${limpiar(c.fecha)}","${limpiar(c.hora)}","${limpiar(c.cliente)}","${limpiar(c.servicio)}",${Number(c.precio) || 0}\n`;
        });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Agenda_Kathe_Creative_Nails.csv";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // Los botones existentes usan atributos onclick en el HTML.
    window.agregarCita = agregarCita;
    window.cambiarServicio = cambiarServicio;
    window.eliminarCita = eliminarCita;
    window.exportarCSV = exportarCSV;
</script>

</body>
</html>
